name: Build fonts (xi38 + xi52)

on:
  push:
    branches: [main]
    paths:
      - "scripts/xi52py/**"
      - "sfdsrc/**"
      - "notofonts/**"
      - ".github/workflows/build-xi52-p1onli.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge

      - name: Verify Python syntax
        run: |
          python3 -m py_compile scripts/xi52py/main.py
          python3 -m py_compile scripts/xi52py/copy_sources_to_targets.py
          python3 -m py_compile scripts/xi52py/glyph_copy/glyph_kopi_u9scripts_p1onli.py

      - name: Run pipeline (step 0 + 1)
        run: |
          fontforge -script scripts/xi52py/main.py --only 1
          fontforge -script scripts/xi52py/main.py --only 2

      - name: Upload SFDs (xi38 + xi52, asc)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-sfd
          path: |
            sfd/xi38sfd/xi38asc/
            sfd/xi52sfd/xi52asc/
          if-no-files-found: warn

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            logs/
            scripts/logs/
          if-no-files-found: ignore
