name: Build fonts (ASC only)

on:
  push:
    branches: [main]
    paths:
      - "scripts/xi52py/**"
      - "sfdsrc/**"
      - "notofonts/**"
      - ".github/workflows/build-xi52-p1onli.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge

      - name: Verify Python syntax
        run: |
          python3 -m py_compile scripts/xi52py/main.py
          python3 -m py_compile scripts/xi52py/copy_sources_to_targets.py
          python3 -m py_compile scripts/xi52py/glyph_copy/glyph_kopi_u9scripts_p1onli.py
          python3 -m py_compile scripts/xi52py/generate_xi38asc_ttf_woff2.py
          python3 -m py_compile scripts/xi52py/generate_xi52asc_ttf_woff2.py
          python3 -m py_compile scripts/xi52py/update_font_metadata.py

      - name: Run ASC pipeline (build)
        run: |
          fontforge -script scripts/xi52py/main.py --only 1
          fontforge -script scripts/xi52py/main.py --only 2
          fontforge -script scripts/xi52py/main.py --only 3

      - name: Update font metadata
        run: |
          fontforge -script scripts/xi52py/update_font_metadata.py

      - name: Clean old fonts
        run: |
          rm -f xnglofonts/ttf/xi52ttf/xi52asc/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38asc/*.ttf
          rm -f xnglofonts/woff2/xi52woff2/xi52asc/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38asc/*.woff2

      - name: Generate ASC TTF/WOFF2
        run: |
          fontforge -script scripts/xi52py/main.py --only 11
          fontforge -script scripts/xi52py/main.py --only 13

      - name: Upload SFDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-sfd
          path: |
            sfd/xi38sfd/xi38asc/
            sfd/xi52sfd/xi52asc/

      - name: Upload TTF/WOFF2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asc-fonts
          path: xnglofonts/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
