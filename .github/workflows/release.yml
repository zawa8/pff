name: Release fonts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.3.3)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Verify tag exists
        run: |
          git rev-parse "${{ steps.tag.outputs.tag }}" >/dev/null

      - name: Collect fonts
        run: |
          mkdir -p release
          cp -r xnglofonts release/
          find release -type f | sort | head -20
          echo "..."
          echo "Total files: $(find release -type f | wc -l)"

      - name: Create zip
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cd release
          zip -r "../xnglo-fonts-${TAG}.zip" . -x "*.DS_Store" "*/__MACOSX/*"
          cd ..
          ls -lh "xnglo-fonts-${TAG}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            xnglo-fonts-*.zip
          fail_on_unmatched_files: true
