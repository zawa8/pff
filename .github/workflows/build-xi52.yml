name: Build fonts (ASC + UTF)

on:
  push:
    branches: [main]
    paths:
      - "pysk/xi52py/**"
      - "pysk/notopy/**"
      - "sfdsrc/**"
      - ".github/workflows/build-xi52.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04    # 24.04 has fontforge 20230101 which crashes
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FontForge + openpyxl
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge
          fontforge --version
          pip3 install openpyxl --break-system-packages || true

      - name: Verify Python syntax
        run: |
          python3 -m py_compile pysk/xi52py/main.py
          python3 -m py_compile pysk/xi52py/prep_utf.py
          python3 -m py_compile pysk/xi52py/copy_utf_unicode_blocks.py
          python3 -m py_compile pysk/xi52py/verify_utf.py
          python3 -m py_compile pysk/xi52py/p5generate.py
          python3 -m py_compile pysk/xi52py/gen_asc_to_utf_json.py
          python3 -m py_compile pysk/notopy/noto_copy.py
          python3 -m py_compile pysk/notopy/extract_noto_data.py
          python3 -m py_compile pysk/notopy/gen_noto_sheets.py

      - name: Sanity -- print pipeline
        run: fontforge -script pysk/xi52py/main.py --list

      - name: Run prep_utf (sfdsrc -> sfd xi38asc + xi38utf + xi52utf + unicode refs)
        run: fontforge -script pysk/xi52py/prep_utf.py

      - name: Copy unicode blocks to all xi38utf + xi52utf fonts
        run: python3 pysk/xi52py/copy_utf_unicode_blocks.py

      - name: Verify UTF references
        run: fontforge -script pysk/xi52py/verify_utf.py

      - name: Run mono phase
        run: fontforge -script pysk/xi52py/main.py --phase mono

      - name: Update font metadata
        run: fontforge -script pysk/xi52py/main.py --phase meta

      - name: Clean old fonts
        run: |
          rm -f xnglofonts/ttf/xi52ttf/xi52asc/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38asc/*.ttf
          rm -f xnglofonts/ttf/xi52ttf/xi52utf/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38utf/*.ttf
          rm -f xnglofonts/ttf/xi52ttf/xi52mono/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38mono/*.ttf
          rm -f xnglofonts/woff2/xi52woff2/xi52asc/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38asc/*.woff2
          rm -f xnglofonts/woff2/xi52woff2/xi52utf/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38utf/*.woff2
          rm -f xnglofonts/woff2/xi52woff2/xi52mono/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38mono/*.woff2

      - name: Generate TTF/WOFF2
        run: fontforge -script pysk/xi52py/main.py --phase gen

      - name: Commit fonts to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "=== generated fonts ==="
          find xnglofonts/ -type f | sort
          echo "total: $(find xnglofonts/ -type f | wc -l) files"
          echo "=== gitignore check ==="
          cat .gitignore | grep -i "xnglo\|font\|ttf\|woff" || echo "no font rules in gitignore"
          echo "=== git status before add ==="
          git status --short xnglofonts/
          git add -f xnglofonts/ttf/ xnglofonts/woff2/ 2>/dev/null || true
          git add xnglofonts/
          echo "=== git status after add ==="
          git status --short
          git diff --staged --quiet && echo "no changes to commit" ||             git commit -m "ci: update xnglofonts [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

      - name: Upload SFDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfd
          path: |
            sfd/xi38sfd/
            sfd/xi52sfd/

      - name: Upload TTF/WOFF2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: xnglofonts/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
