name: Build fonts (ASC + UTF)

on:
  push:
    branches: [main]
    paths:
      - "scripts/xi52py/**"
      - "sfdsrc/**"
      - "notofonts/**"
      - ".github/workflows/build-xi52.yml"
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FontForge
        run: |
          sudo apt-get update
          sudo apt-get install -y fontforge python3-fontforge

      - name: Verify Python syntax
        run: |
          python3 -m py_compile scripts/xi52py/main.py
          python3 -m py_compile scripts/xi52py/step0_copy_sources.py
          python3 -m py_compile scripts/xi52py/glyph_copy/build_asc_fonts.py
          python3 -m py_compile scripts/xi52py/glyph_copy/build_utf_fonts.py
          python3 -m py_compile scripts/xi52py/gen_xi38asc.py
          python3 -m py_compile scripts/xi52py/gen_xi52asc.py
          python3 -m py_compile scripts/xi52py/update_font_metadata.py

      - name: Sanity -- print pipeline
        run: fontforge -script scripts/xi52py/main.py --list

      - name: Run src + asc phases
        run: |
          fontforge -script scripts/xi52py/main.py --phase src
          fontforge -script scripts/xi52py/main.py --phase asc

      - name: Run utf phase
        run: fontforge -script scripts/xi52py/main.py --phase utf

      - name: Run mono phase
        run: fontforge -script scripts/xi52py/main.py --phase mono

      - name: Update font metadata
        run: fontforge -script scripts/xi52py/main.py --phase meta

      - name: Clean old fonts
        run: |
          rm -f xnglofonts/ttf/xi52ttf/xi52asc/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38asc/*.ttf
          rm -f xnglofonts/ttf/xi52ttf/xi52utf/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38utf/*.ttf
          rm -f xnglofonts/ttf/xi52ttf/xi52mono/*.ttf
          rm -f xnglofonts/ttf/xi38ttf/xi38mono/*.ttf
          rm -f xnglofonts/woff2/xi52woff2/xi52asc/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38asc/*.woff2
          rm -f xnglofonts/woff2/xi52woff2/xi52utf/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38utf/*.woff2
          rm -f xnglofonts/woff2/xi52woff2/xi52mono/*.woff2
          rm -f xnglofonts/woff2/xi38woff2/xi38mono/*.woff2

      - name: Generate TTF/WOFF2
        run: |
          fontforge -script scripts/xi52py/main.py --only 14
          fontforge -script scripts/xi52py/main.py --only 15
          fontforge -script scripts/xi52py/main.py --only 16
          fontforge -script scripts/xi52py/main.py --only 17
          fontforge -script scripts/xi52py/main.py --only 18
          fontforge -script scripts/xi52py/main.py --only 19

      - name: Upload SFDs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sfd
          path: |
            sfd/xi38sfd/
            sfd/xi52sfd/

      - name: Upload TTF/WOFF2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fonts
          path: xnglofonts/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/